    <main>
        <section class="form-container">
            <h2>تسجيل الدخول / حساب جديد</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="fullname">الاسم الكامل:</label>
                    <input class="fullname" type="text">
                </div>
                <div class="form-group" >
                    <label for="age">العمر:</label>
                    <input class="age" type="number" id="age">
                </div>
                <div class="form-group">
                    <label for="email">البريد الإلكتروني:</label>
                    <input  class="email" type="email">
                </div>
                <div class="form-group">
                    <label for="phone">رقم الهاتف:</label>
                    <input  class="phone" type="number">
                    
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور </label>
                    <input  class="password" type="password">
                </div>

                <button class="login" type="submit">تسجيل الدخول</button>

                <button class="hint" type="submit" style=background-color:brown ; >تلميحات</button>

            </form>
        </section>
    </main>
