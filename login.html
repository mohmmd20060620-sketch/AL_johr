<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - جوهرة تعز مول</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <div class="divheader">
            <h1> جوهرة تعز مول - الحوبان</h1>
            <img class="imgheader" src="شعار جوهرة تعز.jpg" alt="شعار المول">
        </div>
        <p>تصفح المحلات والمنتجات حسب الطابق والمحل</p>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="products.html">تصنيفات المنتجات</a></li>
                <li><a href="cart.html">سلة التسوق</a></li>
                <li><a href="orders.html">سجل الطلبات</a></li>
                <li><a href="login.html">تسجيل الدخول</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <button class="hint">اضغط للتلميح بالبيانات</button>

        <section class="form-container">
            <h2>تسجيل الدخول</h2>
            <form onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="username">اسم المستخدم:</label>
                    <input type="text" id="username" class="user" name="username" onfocus="handleInputFocus(this)" onblur="handleInputBlur(this)" oninput="handleInputTextChange(this)" oninvalid="handleInvalidInput(this)" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور:</label>
                    <input type="password" id="password" class="password" name="password" required>
                </div>
                
                <button type="submit" class="login">دخول</button>
                <button type="button" class="newaccount">انشاء حساب جديد</button>
            </form>
            <div id="formStatus" class="output-box">الحالة: بانتظار الإدخال...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة - جوهرة تعز مول (الحوبان)</p>
    </footer>

</body>
</html>
